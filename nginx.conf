# ============================================================
# Nginx：前端静态资源 + 接口反向代理
# 挂载到容器内 /etc/nginx/conf.d/default.conf
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限（秒杀接口都是空 body，给 1M 足够）
    client_max_body_size 1m;

    # ---------- 前端路由 ----------
    # 必须用 try_files，否则直接访问 /goods/1 会 404
    # （vue-router 的 history 模式，浏览器里没有对应的物理文件）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 接口反向代理 ----------
    # 注意 proxy_pass 末尾没有斜杠：
    #   /api/seckill/goods → http://app:8081/api/seckill/goods  （路径原样保留）
    # 如果写成 http://app:8081/ （带斜杠），/api 前缀会被吃掉，后端全部 404
    location /api/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 健康检查（给以后接监控用，现在返回 200 即可）
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
