# ============================================================
# 云服务器环境（docker-compose.prod.yml 内使用）
#
# 与 application-docker.yml 的关键区别：
#   docker  → host.docker.internal:3307/6380/5672
#             这是 Docker Desktop 专用写法，Linux 上没有这个主机名
#   cloud   → mysql:3306 / redis:6379 / rabbitmq:5672
#             走 compose 自定义网络，用「服务名 + 容器内端口」
#
# 密码全部从环境变量读，不写在文件里，避免提交到 git
# ============================================================
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Seckill-HikariPool
      maximum-pool-size: 10      # 2 核小机，连接池不宜开太大
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      auto-commit: true
  data:
    redis:
      host: redis                # ← compose 服务名
      port: 6379                 # ← 容器内端口，不是宿主机映射的 6380
      database: 0
      timeout: 3000
  rabbitmq:
    host: rabbitmq               # ← compose 服务名
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
    template:
      retry:
        enabled: true
        multiplier: 2

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.seckill.mapper: info   # 生产不打 SQL，日志量会爆

seckill:
  mq:
    fail-test: false           # 线上必须关：打开会让消费者故意抛异常
  limit:
    capacity: 100              # 令牌桶容量（演示够用，压测时可临时调大）
    rate: 20                   # 每秒补充 20 个令牌
